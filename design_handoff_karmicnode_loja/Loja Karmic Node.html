<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karmic Node — Loja</title>
<meta name="description" content="Karmic Node — Moda com alma. Estilo atemporal. Portugal." />
<link rel="icon" type="image/png" href="assets/logo-karmic-node.png" />
<link rel="stylesheet" href="assets/karmic-loja.css" />
<style>
  /* Fallback while React/Babel are still loading */
  #root:empty::before {
    content: 'A carregar loja…';
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold, #B08D57);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: .3em;
    text-transform: uppercase;
  }
</style>

<!-- React 18 (repo declara react@19 mas a 18 suporta o mesmo hooks-API usado) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<!-- Babel Standalone com TypeScript preset -->
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- i18n primeiro -->
<script src="assets/i18n-loja.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- App: fetch + Babel transform manual (mais fiável que <script type=text/babel src>) -->
  <script>
    (async () => {
      try {
        const res = await fetch('assets/App-loja.tsx?v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch App-loja.tsx: ' + res.status);
        const src = await res.text();
        const out = Babel.transform(src, {
          presets: ['typescript', ['react', { runtime: 'classic' }]],
          filename: 'App-loja.tsx'
        });
        // Executar código transpilado no escopo global (via <script> injection)
        const s = document.createElement('script');
        s.textContent = out.code;
        document.body.appendChild(s);
      } catch (e) {
        console.error('[Karmic Loja] Erro ao inicializar:', e);
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding:60px 40px;color:#e06070;font-family:monospace;font-size:13px;line-height:1.6;background:#0B0B0C;min-height:100vh"><b>Erro ao carregar loja:</b><br><br>' + String(e).replace(/</g,'&lt;') + '<br><br><pre style="white-space:pre-wrap;color:#a7a7a7;font-size:11px">' + (e.stack || '').replace(/</g,'&lt;') + '</pre></div>';
        }
      }
    })();
  </script>
</body>
</html>
